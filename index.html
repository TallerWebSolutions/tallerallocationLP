  <style>
    /* ══════════════════════════════════
       TOKENS
       ══════════════════════════════════ */
    :root {
      /* Surface + ink */
      --black: #000000;
      --carbon: #1B1B1D;
      --white: #FFFFFF;
      --silver: #E8E8E8;
      --graphite: #878787;
      --graphite-30: rgba(135, 135, 135, 0.3);
      --graphite-15: rgba(135, 135, 135, 0.15);

      /* Heat palette (accent) */
      --heat: #E64C28;
      --flame: #DA2037;
      --solar: #F56F10;
      --gold: #F9C972;
      --heat-gradient: linear-gradient(90deg, var(--heat) 0%, var(--flame) 37%, var(--gold) 100%);

      /* Type stacks */
      --font: 'Geist', 'Inter', system-ui, sans-serif;
      --mono: 'Geist Mono', 'Courier New', ui-monospace, monospace;
      --pixel: 'VT323', monospace;

      /* Easings */
      --ease: cubic-bezier(0.19, 1, 0.22, 1);             /* expo-out, padrão */
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);   /* overshoot suave */
      --ease-curtain: cubic-bezier(0.76, 0, 0.24, 1);     /* cortina */

      /* Structural */
      --border: 1px solid var(--graphite-30);
    }

    /* ══════════════════════════════════
       RESET + BASE
       ══════════════════════════════════ */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    img,
    svg {
      display: block;
      max-width: 100%;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
    }

    ::selection {
      background: var(--gold);
      color: var(--black);
    }

    /* ══════════════════════════════════
       TYPOGRAPHY
       ══════════════════════════════════ */
    h1,
    h2,
    h3,
    h4 {
      font-family: var(--mono);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--white);
    }

    p {
      color: var(--silver);
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .label {
      font-family: var(--pixel);
      font-size: 1.05rem;
      color: var(--graphite);
      letter-spacing: 0.08em;
      text-transform: none;
    }

    /* Accessibility — skip link */
    .skip-link {
      position: absolute;
      top: -40px;
      left: 8px;
      padding: 8px 14px;
      background: var(--white);
      color: var(--black);
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      z-index: 1000;
      transition: top 0.2s var(--ease);
    }

    .skip-link:focus {
      top: 8px;
    }
  </style>
</head>
