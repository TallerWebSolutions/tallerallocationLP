    rel="stylesheet">

  <style>
    /* ══════════════════════════════════ TOKENS ══════════════════════════════════ */
    :root {
      --black: #000000;
      --carbon: #1B1B1D;
      --white: #FFFFFF;
      --silver: #E8E8E8;
      --graphite: #878787;
      --graphite-30: rgba(135, 135, 135, 0.3);
      --graphite-15: rgba(135, 135, 135, 0.15);

      --heat: #E64C28;
      --flame: #DA2037;
      --solar: #F56F10;
      --gold: #F9C972;
      --heat-gradient: linear-gradient(90deg, var(--heat) 0%, var(--flame) 37%, var(--gold) 100%);

      --font: 'Geist', 'Inter', system-ui, sans-serif;
      --mono: 'Geist Mono', 'Courier New', ui-monospace, monospace;
      --pixel: 'VT323', monospace;

      --ease: cubic-bezier(0.19, 1, 0.22, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-curtain: cubic-bezier(0.76, 0, 0.24, 1);
      --ease-reveal: cubic-bezier(0.16, 1, 0.3, 1);

      --border: 1px solid var(--graphite-30);
    }

    /* ══════════════════════════════════ RESET + BASE ══════════════════════════════════ */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    body.loading { overflow: hidden; }

    img, svg { display: block; max-width: 100%; }

    button { font: inherit; color: inherit; background: none; border: 0; }

    ::selection { background: var(--gold); color: var(--black); }

    /* ══════════════════════════════════ TYPOGRAPHY ══════════════════════════════════ */
    h1, h2, h3, h4 {
      font-family: var(--mono);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--white);
    }

    p {
      color: var(--silver);
      line-height: 1.7;
    }

    a { color: inherit; text-decoration: none; }

    .label {
      font-family: var(--pixel);
      font-size: 1.05rem;
      color: var(--graphite);
      letter-spacing: 0.08em;
    }

    .skip-link {
      position: absolute;
      top: -40px;
      left: 8px;
      padding: 8px 14px;
      background: var(--white);
      color: var(--black);
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      z-index: 1000;
      transition: top 0.2s var(--ease);
    }

    .skip-link:focus { top: 8px; }

    /* ══════════════════════════════════ SCROLL PROGRESS ══════════════════════════════════ */
    #scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--heat-gradient);
      z-index: 102;
      transform-origin: left;
      transform: scaleX(0);
      pointer-events: none;
      will-change: transform;
    }

    /* ══════════════════════════════════ LOADER ══════════════════════════════════ */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      pointer-events: all;
    }

    #loader.done { pointer-events: none; }

    .loader-half {
      width: 50%;
      height: 100%;
      background: var(--black);
      transition: transform 1s var(--ease-curtain);
    }

    #loader.done .loader-left  { transform: translateX(-100%); }
    #loader.done .loader-right { transform: translateX(100%); }

    .loader-logo {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 201;
      opacity: 1;
      transition: opacity 0.35s ease;
    }

    .loader-logo svg { height: 32px; width: auto; display: block; }

    #loader.done .loader-logo { opacity: 0; }

    /* ══════════════════════════════════ CUSTOM CURSOR ══════════════════════════════════ */
    @media (hover: hover) and (pointer: fine) {
      body:not(.loading) { cursor: none; }
      body:not(.loading) a,
      body:not(.loading) button { cursor: none; }
    }

    #cursor-dot, #cursor-ring {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9999;
      border-radius: 50%;
      opacity: 0;
      will-change: transform;
    }

    body.cursor-ready #cursor-dot,
    body.cursor-ready #cursor-ring { opacity: 1; }

    #cursor-dot {
      width: 6px;
      height: 6px;
      background: var(--white);
      margin: -3px 0 0 -3px;
      transition: opacity 0.3s var(--ease);
    }

    #cursor-ring {
      width: 36px;
      height: 36px;
      border: 1px solid var(--silver);
      margin: -18px 0 0 -18px;
      opacity: 0;
      transition: border-color 0.3s var(--ease), opacity 0.3s var(--ease),
        width 0.3s var(--ease), height 0.3s var(--ease), margin 0.3s var(--ease);
    }

    body.cursor-ready #cursor-ring { opacity: 0.45; }

    #cursor-ring.hovering {
      border-color: var(--gold);
      width: 44px;
      height: 44px;
      margin: -22px 0 0 -22px;
      opacity: 0.7;
    }

    @media (hover: none), (pointer: coarse) {
      #cursor-dot, #cursor-ring { display: none; }
    }

    /* ══════════════════════════════════ BUTTONS ══════════════════════════════════ */
    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--mono);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      padding: 14px 28px;
      border-radius: 50px;
      border: 1.5px solid transparent;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.3s var(--ease), color 0.3s var(--ease),
        box-shadow 0.3s var(--ease), border-color 0.3s var(--ease),
        opacity 0.3s var(--ease);
    }

    @media (hover: hover) and (pointer: fine) {
      .btn { cursor: none; }
    }

    .btn-mini { padding: 6px 14px;  font-size: 0.72rem; }
    .btn-sm   { padding: 10px 22px; font-size: 0.78rem; }
    .btn-lg   { padding: 16px 36px; font-size: 0.92rem; }
    .btn-xl   { padding: 20px 48px; font-size: 1rem; }

    .btn-primary, .btn-gold {
      background: var(--heat-gradient);
      color: var(--white);
    }

    .btn-primary::before, .btn-gold::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 53px;
      background: var(--heat-gradient);
      filter: blur(14px);
      opacity: 0.3;
      z-index: -1;
      transition: opacity 0.3s var(--ease), filter 0.3s var(--ease);
      animation: glow-fade 3s ease-in-out infinite;
    }

    .btn-primary:hover::before, .btn-gold:hover::before {
      opacity: 0.55;
      filter: blur(18px);
    }

    .btn-primary:hover, .btn-primary:active,
    .btn-gold:hover, .btn-gold:active {
      background: linear-gradient(90deg, var(--flame), #b01a20);
    }

    .btn-primary:focus-visible, .btn-gold:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(230, 76, 40, 0.55);
    }

    .btn-primary:disabled, .btn-primary[aria-disabled="true"],
    .btn-gold:disabled, .btn-gold[aria-disabled="true"] {
      background: linear-gradient(90deg, rgba(230, 76, 40, 0.35), rgba(218, 32, 55, 0.35));
      color: rgba(255, 255, 255, 0.45);
      pointer-events: none;
    }

    .btn-primary:disabled::before, .btn-primary[aria-disabled="true"]::before,
    .btn-gold:disabled::before, .btn-gold[aria-disabled="true"]::before { opacity: 0; }

    .btn-alternate {
      background: #111111;
      color: var(--white);
    }
    .btn-alternate:hover, .btn-alternate:active { background: #2a2a2a; }
    .btn-alternate:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
    }
    .btn-alternate:disabled, .btn-alternate[aria-disabled="true"] {
      background: #1a1a1a;
      color: rgba(255, 255, 255, 0.3);
      pointer-events: none;
    }

    .btn-secondary, .btn-outline {
      background: transparent;
      color: var(--silver);
      border-color: rgba(135, 135, 135, 0.45);
    }
    .btn-secondary:hover, .btn-secondary:active,
    .btn-outline:hover, .btn-outline:active {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--silver);
      color: var(--white);
    }
    .btn-secondary:focus-visible, .btn-outline:focus-visible {
      outline: none;
      border-color: var(--silver);
      box-shadow: 0 0 0 3px rgba(135, 135, 135, 0.3);
    }
    .btn-secondary:disabled, .btn-secondary[aria-disabled="true"],
    .btn-outline:disabled, .btn-outline[aria-disabled="true"] {
      background: transparent;
      border-color: rgba(135, 135, 135, 0.2);
      color: rgba(135, 135, 135, 0.4);
      pointer-events: none;
    }

    .btn-alert {
      background: #b71c2e;
      color: var(--white);
    }
    .btn-alert:hover, .btn-alert:active { background: #8f1422; }
    .btn-alert:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(183, 28, 46, 0.5);
    }
    .btn-alert:disabled, .btn-alert[aria-disabled="true"] {
      background: rgba(183, 28, 46, 0.35);
      color: rgba(255, 255, 255, 0.4);
      pointer-events: none;
    }

    .bracket {
      font-family: var(--pixel);
      font-size: 1.1rem;
      opacity: 0;
      transition: opacity 0.3s var(--ease);
    }
    .btn-primary:hover .bracket,
    .btn-gold:hover .bracket { opacity: 1; }

    @keyframes glow-fade {
      0%, 100% { opacity: 0.25; filter: blur(12px); }
      50%      { opacity: 0.45; filter: blur(18px); }
    }

    /* ══════════════════════════════════
       MOTION PRIMITIVES
       reveal · split text · line reveal · heat pulse · gold sweep
       ══════════════════════════════════ */

    /* Reveal — translateY in */
    .reveal {
      opacity: 0;
      transform: translateY(32px);
      transition: opacity 0.85s var(--ease-reveal), transform 0.85s var(--ease-reveal);
      will-change: opacity, transform;
    }

    /* Reveal — translateX left */
    .reveal-left {
      opacity: 0;
      transform: translateX(-36px);
      transition: opacity 0.85s var(--ease-reveal), transform 0.85s var(--ease-reveal);
      will-change: opacity, transform;
    }

    /* Reveal — translateX right */
    .reveal-right {
      opacity: 0;
      transform: translateX(36px);
      transition: opacity 0.85s var(--ease-reveal), transform 0.85s var(--ease-reveal);
      will-change: opacity, transform;
    }

    /* Reveal — scale up */
    .reveal-scale {
      opacity: 0;
      transform: scale(0.94);
      transition: opacity 0.85s var(--ease-reveal), transform 0.85s var(--ease-reveal);
      will-change: opacity, transform;
    }

    .reveal.in,
    .reveal-left.in,
    .reveal-right.in,
    .reveal-scale.in {
      opacity: 1;
      transform: none;
    }

    /* Stagger via custom property (parent sets --i, children use it) */
    .reveal[style*="--i"] {
      transition-delay: calc(var(--i, 0) * 80ms);
    }

    /* Split text — each char fades in sequentially */
    .split-ready {
      visibility: hidden;
    }

    .split-ready.ready {
      visibility: visible;
    }

    .split-ready .word {
      display: inline-block;
      overflow: hidden;
      vertical-align: bottom;
    }

    .split-ready .char {
      display: inline-block;
      opacity: 0;
      transform: translateY(0.6em);
      transition: opacity 0.32s var(--ease), transform 0.55s var(--ease);
      transition-delay: calc(var(--char-index, 0) * 16ms);
    }

    .split-ready.in .char {
      opacity: 1;
      transform: translateY(0);
    }

    /* Line reveal — clip-path top to bottom */
    .line-reveal {
      clip-path: inset(0 0 100% 0);
      transition: clip-path 1.2s var(--ease);
    }

    .line-reveal.in {
      clip-path: inset(0 0 0% 0);
    }

    /* Heat pulse — gradient clipped to text, shifting forever */
    .heat-pulse {
      background: var(--heat-gradient);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: heat-pulse-shift 3s ease-in-out infinite;
    }

    @keyframes heat-pulse-shift {
      0%, 100% { background-position: 0% center; }
      50%      { background-position: 100% center; }
    }

    /* Gold sweep — underline that grows on demand */
    .gold {
      color: var(--heat);
      background: linear-gradient(90deg, var(--heat), var(--gold)) no-repeat left bottom;
      background-size: 0% 2px;
      transition: background-size 0.8s var(--ease);
      padding-bottom: 2px;
    }

    .gold.sweep {
      background-size: 100% 2px;
    }

    /* ══════════════════════════════════ REDUCED MOTION ══════════════════════════════════ */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }

      #loader { display: none; }
      #cursor-dot, #cursor-ring { display: none; }

      .reveal, .reveal-left, .reveal-right, .reveal-scale,
      .split-ready, .split-ready .char,
      .line-reveal {
        opacity: 1 !important;
        transform: none !important;
        clip-path: none !important;
        visibility: visible !important;
      }

      @media (hover: hover) and (pointer: fine) {
        body:not(.loading) { cursor: auto; }
        .btn { cursor: pointer; }
      }
    }
  </style>
</head>
<body class="loading">
  <a href="#main" class="skip-link">Pular para o conteúdo</a>

  <div id="scroll-progress" aria-hidden="true"></div>

  <div id="loader" aria-hidden="true">
    <div class="loader-half loader-left"></div>
    <div class="loader-half loader-right"></div>
    <div class="loader-logo">
      <svg width="120" height="32" viewBox="0 0 120 32" xmlns="http://www.w3.org/2000/svg">
        <text x="0" y="22" font-family="Geist Mono, monospace" font-weight="700" font-size="22" fill="#FFFFFF" letter-spacing="0.04em">taller</text>
      </svg>
    </div>
  </div>

  <div id="cursor-dot" aria-hidden="true"></div>
  <div id="cursor-ring" aria-hidden="true"></div>

  <main id="main">
    <!-- LP sections will land here, one at a time, starting with the Hero. -->
  </main>

  <script>
    (() => {
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // ── Loader ──────────────────────────────
      const loader = document.getElementById('loader');
      const finishLoad = () => {
        document.body.classList.remove('loading');
        document.body.classList.add('cursor-ready');
        loader.classList.add('done');
      };

      if (document.readyState === 'complete') {
        requestAnimationFrame(finishLoad);
      } else {
        window.addEventListener('load', () => requestAnimationFrame(finishLoad));
      }

      // ── Scroll progress ─────────────────────
      const progress = document.getElementById('scroll-progress');
      const updateProgress = () => {
        const max = document.documentElement.scrollHeight - window.innerHeight;
        const ratio = max > 0 ? window.scrollY / max : 0;
        progress.style.transform = `scaleX(${Math.min(1, Math.max(0, ratio))})`;
      };
      window.addEventListener('scroll', updateProgress, { passive: true });
      window.addEventListener('resize', updateProgress, { passive: true });
      updateProgress();

      // ── Custom cursor ───────────────────────
      const fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      if (fine && !prefersReducedMotion) {
        const dot = document.getElementById('cursor-dot');
        const ring = document.getElementById('cursor-ring');
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let ringX = mouseX;
        let ringY = mouseY;

        window.addEventListener('mousemove', (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
          dot.style.transform = `translate(${mouseX}px, ${mouseY}px)`;
        }, { passive: true });

        const loop = () => {
          ringX += (mouseX - ringX) * 0.18;
          ringY += (mouseY - ringY) * 0.18;
          ring.style.transform = `translate(${ringX}px, ${ringY}px)`;
          requestAnimationFrame(loop);
        };
        loop();

        document.addEventListener('mouseover', (e) => {
          if (e.target.closest('a, button, .magnetic')) {
            ring.classList.add('hovering');
          }
        });
        document.addEventListener('mouseout', (e) => {
          if (e.target.closest('a, button, .magnetic')) {
            ring.classList.remove('hovering');
          }
        });
      }

      // ── Split text — wraps each char in a <span> with --char-index ──
      // Targets: any element with class "split-text" (becomes split-ready after processing)
      document.querySelectorAll('.split-text').forEach((el) => {
        const text = el.textContent;
        el.textContent = '';
        let charIndex = 0;

        text.split(' ').forEach((word, wordIndex, words) => {
          const wordSpan = document.createElement('span');
          wordSpan.className = 'word';

          [...word].forEach((ch) => {
            const charSpan = document.createElement('span');
            charSpan.className = 'char';
            charSpan.style.setProperty('--char-index', charIndex++);
            charSpan.textContent = ch;
            wordSpan.appendChild(charSpan);
          });

          el.appendChild(wordSpan);
          if (wordIndex < words.length - 1) el.appendChild(document.createTextNode(' '));
        });

        el.classList.remove('split-text');
        el.classList.add('split-ready', 'ready');
      });

      // ── Reveal observer — adds .in when element enters viewport ──
      const revealTargets = document.querySelectorAll(
        '.reveal, .reveal-left, .reveal-right, .reveal-scale, .split-ready, .line-reveal'
      );

      if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('in');
              io.unobserve(entry.target);
            }
          });
        }, {
          threshold: 0.15,
          rootMargin: '0px 0px -10% 0px',
        });

        revealTargets.forEach((el) => io.observe(el));
      } else {
        // Fallback: just show everything
        revealTargets.forEach((el) => el.classList.add('in'));
      }

      // ── Gold sweep — triggered on demand by adding .sweep class ──
      // Auto-trigger on elements with class "gold-auto" when they enter viewport
      const goldAutos = document.querySelectorAll('.gold-auto');
      if (goldAutos.length && 'IntersectionObserver' in window) {
        const goldIO = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('sweep');
              goldIO.unobserve(entry.target);
            }
          });
        }, { threshold: 0.5 });
        goldAutos.forEach((el) => goldIO.observe(el));
      }
    })();
  </script>
</body>
